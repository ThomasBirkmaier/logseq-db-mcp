[project]
name = "logseq-db-mcp"
version = "0.1.0"
description = "DB-native MCP server for Logseq DB graphs, via the local HTTP API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["mcp", "logseq", "model-context-protocol", "knowledge-management"]
dependencies = [
    "mcp>=2.0,<3",
    "jsonschema>=4.20",
    "requests>=2.32.3",
]

[[project.authors]]
name = "Thomas Birkmaier"

[project.scripts]
logseq-db-mcp = "logseq_db_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["live: needs a running Logseq with the test graph SpikeTest open"]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "responses>=0.23.0",
    "pytest-asyncio>=0.21.0",
]
